name: Deploy preview on pull request

# Forks have no access to the repository secrets, so this only runs for
# branches pushed to this repo — which is the only case that matters here.
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # posts the temporary preview URL as a comment on the PR
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADRIEN_BONVIN_PORTFOLIO }}
          projectId: adrien-bonvin-portfolio
