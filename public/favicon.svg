<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- the trail fades out behind the astre: violet at the origin, cyan at the head -->
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- the tile is what gives the mark a silhouette at 16px, where a floating shape turns to mush -->
  <rect width="32" height="32" rx="7.5" fill="#050510"/>
  <path d="M5.5 26.5 C 8.5 21, 12.5 15.5, 20 11" fill="none" stroke="url(#trail)"
        stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="23.6" cy="9.2" r="3.9" fill="#22d3ee"/>
</svg>
